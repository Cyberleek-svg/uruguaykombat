<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Uruguay Kombat</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' ws: wss: http://localhost:*">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
    #game-container { width: 100%; height: 100%; touch-action: none; }
    canvas { display: block; touch-action: none; }
    /* Aviso (no bloquea el juego) cuando el celular esta en vertical */
    #rotate-hint { display: none; }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate-hint {
        display: block; position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        padding: 10px 12px; background: rgba(0,0,0,0.85); color: #ffeb3b;
        font: bold 14px monospace; text-align: center; pointer-events: none;
      }
    }
  </style>
</head>
<body>
  <div id="rotate-hint">&#8635; Gira el celular en horizontal para jugar mejor</div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
